name: ejson_generator
description: >-
  EJSON serialization.

  BSON is a binary format used to store JSON-like documents efficiently.
  EJSON extends JSON defining how all BSON types should be represented in JSON.

topics:
  - ejson
  - bson
  - json
  - build-runner
  - codegen

version: 0.4.2
repository: https://github.com/realm/realm-dart/ejson/packages/ejson_generator

environment:
  sdk: ^3.7.0

dependencies:
  analyzer: ^8.0.0
  build: 4.0.2
  ejson_analyzer: ^0.4.2
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: ^2.6.0
  build_test: ^3.0.0
  dart_style: ^3.0.1
  ejson: ^0.4.2
  ejson_annotation: ^0.4.2
  lints: ^6.0.0
  meta: ^1.15.0
  test: ^1.27.0
  pub_semver: ^2.2.0
